<style>

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

.wrap { max-width: 980px; margin: 0 auto; padding-block: 40px 72px; display: grid; gap: 32px; }

.hero { display: grid; gap: 14px; padding-top: 8px; }
.eyebrow {
  font-size: .78rem; letter-spacing: .16em; text-transform: uppercase;

}
.staff { position: relative; padding-block: 14px; }
.staff::before {

  background-position: 0 10%;
  pointer-events: none;
}
.hero h1 {
  position: relative; margin: 0;

  font-size: clamp(2.6rem, 9vw, 5rem); line-height: .98; letter-spacing: -.01em;

}

.hero p { margin: 0; max-width: 56ch; color: var(--ink-soft); font-size: 1.02rem; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip, .random {
  font: inherit; font-size: .9rem; cursor: pointer;

  border: 1px solid var(--rule); background: transparent; color: var(--ink);
  transition: background .2s, color .2s, border-color .2s;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.random { border-color: var(--rose); color: var(--rose); }
.random:hover { background: var(--rose-soft); }
.chip:focus-visible, .random:focus-visible, .env:focus-visible, .close:focus-visible, .listen:focus-visible {
  outline: 2px solid var(--rose); outline-offset: 3px;
}

/* Grupos */
#groups { display: grid; gap: 32px; }
.group { display: grid; gap: 14px; }
.group h2 {
  margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  font-family: var(--f-display); font-weight: 600; font-size: 1.55rem;
}
.group h2 span { font-family: var(--f-body); font-size: .8rem; font-weight: 400; color: var(--ink-soft); letter-spacing: .04em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

/* Sobres */
.env {
  position: relative; text-align: left; cursor: pointer;
  font: inherit; color: var(--ink);
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px;
  padding: 44px 14px 14px; min-height: 140px;

  transition: transform .25s ease;

}
.env::before { /* solapa del sobre */
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 46px;
  background: linear-gradient(to bottom right, transparent 49.5%, var(--rule) 50%, transparent 51%),

  background-size: 50% 100%; background-position: left, right; background-repeat: no-repeat;
}
.seal { /* sello de lacre */
  position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--rose); color: var(--sheet);
  display: grid; place-items: center; font-size: 15px; line-height: 1;
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.18);

.env:hover { transform: translateY(-3px); }
.env .when { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 18px; }
.env .mood { font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 1.45rem; line-height: 1.05; }
.env.opened .seal { background: transparent; color: var(--rose); box-shadow: inset 0 0 0 1.5px var(--rose); }

.env.locked .seal { background: var(--rule); color: var(--ink-soft); box-shadow: none; }

dialog {

.pending { font-size: .88rem; color: var(--ink-soft); font-style: italic; }
audio, .sc, .vid { width: 100%; border: 0; border-radius: 6px; display: block; }
.sc { height: 120px; }
.vid { aspect-ratio: 16 / 9; max-width: 100%; height: auto; background: #000; }
video.vid { object-fit: contain; }
#l-media { display: grid; gap: 10px; }
#l-media:empty { display: none; }
.note {
  font-family: var(--f-hand); font-size: 1.45rem; line-height: 1.45; margin: 0;
  background: repeating-linear-gradient(to bottom, transparent 0 calc(1.45em - 1px), var(--rule) calc(1.45em - 1px) 1.45em);

}
.sign { font-family: var(--f-hand); font-size: 1.5rem; color: var(--rose); text-align: right; margin: -6px 0 0; }

footer { text-align: center; color: var(--ink-soft); font-size: .85rem; }
footer em { font-family: var(--f-display); font-size: 1.1rem; }

@media (prefers-reduced-motion: reduce) {
  .env { transition: none; }
  dialog[open] .letter { animation: none; }
}
</style>
</head>

const DISPONIBLES = EMOCIONES.filter(disponible);

const ICONO_CERRADO = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
const ICONO_ABIERTO = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg>`;

// Mensajito flotante
const toastEl = document.getElementById("toast");
let toastTimer;
function aviso(texto) {
  toastEl.textContent = texto;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
}

document.getElementById("t-count").textContent =
  `${DISPONIBLES.length} de ${EMOCIONES.length} sobres desbloqueados`;

// Textos generales
document.getElementById("t-eyebrow").textContent = TEXTOS.subtitulo;
document.getElementById("t-intro").textContent = TEXTOS.intro;
document.getElementById("t-footer").innerHTML = `${TEXTOS.pie} <em>${TEXTOS.firma}</em>`;
document.getElementById("l-sign").textContent = TEXTOS.firma;

// Recordar qué sobres ya se han abierto (solo en su móvil/navegador)
const CLAVE = "abrelo-cuando-abiertos";
let abiertos = new Set();
try { abiertos = new Set(JSON.parse(localStorage.getItem(CLAVE) || "[]")); } catch (e) {}
function recordar(id) {
  abiertos.add(id);
  try { localStorage.setItem(CLAVE, JSON.stringify([...abiertos])); } catch (e) {}
}

// Pintar los sobres
const groupsEl = document.getElementById("groups");
function pintar(filtro) {
  groupsEl.innerHTML = "";
  Object.entries(GRUPOS).forEach(([gid, g]) => {
    if (filtro !== "all" && filtro !== gid) return;
    const delGrupo = EMOCIONES.filter(e => e.grupo === gid);
    const sec = document.createElement("section");
    sec.className = "group";
    sec.innerHTML = `<h2>${g.nombre}<span>${g.sub}</span></h2><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    delGrupo.forEach(e => {
      const libre = disponible(e);
      const b = document.createElement("button");
      b.className = "env" + (!libre ? " locked" : abiertos.has(e.id) ? " opened" : "");
      b.dataset.id = e.id;
      b.setAttribute("aria-label", libre ? `Ábrelo cuando estés ${e.estado}` : `${e.estado}: todavía cerrado`);
      b.innerHTML = `<span class="seal">${libre ? ICONO_ABIERTO : ICONO_CERRADO}</span><span class="when">Ábrelo cuando estés</span><span class="mood">${e.estado}</span>`;
      b.addEventListener("click", () => {
        if (libre) { location.hash = e.id; return; }
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        aviso(TEXTOS.bloqueado);
      });
      grid.appendChild(b);
    });
    groupsEl.appendChild(sec);
  });
}
pintar("all");

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  pintar(c.dataset.filter);
}));

// Abrir / cerrar cartas
const dlg = document.getElementById("letter");
function esArchivo(a) { return /\.(mp3|m4a|wav|ogg|aac)$/i.test(a) && !/^https?:/i.test(a); }
function esSoundCloud(a) { return /soundcloud\.com/i.test(a); }
function esVideoArchivo(v) { return /\.(mp4|webm|mov|m4v)$/i.test(v) && !/^https?:/i.test(v); }
function idYouTube(url) {
  const r = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/i);
  return r ? r[1] : null;
}

function abrirCarta(id) {
  const e = EMOCIONES.find(x => x.id === id);
  if (!e || !disponible(e)) return;
  document.getElementById("l-mood").textContent = e.estado;
  document.getElementById("l-title").textContent = e.pieza;
  document.getElementById("l-meta").textContent = `${e.compositor} · ${e.tonalidad}`;
  document.getElementById("l-note").textContent = e.carta;

  const m = document.getElementById("l-media");
  let html = "";

  // Vídeo
  if (e.video) {
    const yt = idYouTube(e.video);
    if (yt) {
      html += `<iframe class="vid" src="https://www.youtube-nocookie.com/embed/${yt}?rel=0" title="Vídeo de ${e.pieza}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    } else if (esVideoArchivo(e.video)) {
      html += `<video class="vid" controls playsinline preload="metadata" src="${e.video}"></video>`;
    } else {
      html += `<a class="listen" href="${e.video}" target="_blank" rel="noopener">${TEXTOS.botonVideo}</a>`;
    }
  }

  // Audio
  if (e.audio) {
    if (esArchivo(e.audio)) {
      html += `<audio controls preload="none" src="${e.audio}"></audio>`;
    } else if (esSoundCloud(e.audio)) {
      const src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(e.audio) +
                  "&color=%23b84a6e&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false";
      html += `<iframe class="sc" allow="autoplay" src="${src}" title="Grabación de ${e.pieza}"></iframe>`;
    } else {
      html += `<a class="listen" href="${e.audio}" target="_blank" rel="noopener">${TEXTOS.botonEscuchar}</a>`;
    }
  }

  if (!html) html = `<span class="pending">${TEXTOS.sinAudio}</span>`;
  m.innerHTML = html;

  if (!dlg.open) dlg.showModal();
  recordar(id);
  const env = document.querySelector(`.env[data-id="${id}"]`);
  if (env) env.classList.add("opened");
}

function cerrarCarta() {
  document.getElementById("l-media").innerHTML = ""; // para que pare la música y el vídeo
  if (dlg.open) dlg.close();
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}
document.getElementById("close").addEventListener("click", cerrarCarta);
dlg.addEventListener("click", ev => { if (ev.target === dlg) cerrarCarta(); });
dlg.addEventListener("cancel", ev => { ev.preventDefault(); cerrarCarta(); });

document.getElementById("random").addEventListener("click", () => {
  if (!DISPONIBLES.length) { aviso(TEXTOS.bloqueado); return; }
  const e = DISPONIBLES[Math.floor(Math.random() * DISPONIBLES.length)];
  location.hash = e.id;
});

// Enlaces directos tipo tuweb.com/#triste (para los QR)
function ruta() {
  const id = decodeURIComponent(location.hash.slice(1));
  const e = id && EMOCIONES.find(x => x.id === id);
  if (e && disponible(e)) abrirCarta(id);
  else {
    if (dlg.open) dlg.close();
    if (e) { aviso(TEXTOS.bloqueado); history.replaceState(null, "", location.pathname + location.search); }
  }
}
window.addEventListener("hashchange", ruta);
ruta();
</script>
</body>
</html>
